<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz</title>
<style>
body{font-family:sans-serif;margin:0;text-align:center;background:#222;color:#fff}
#tela{padding:20px}
input,button{font-size:20px;padding:14px;width:90%;margin:8px 0;border:0;border-radius:8px}
.alts{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:75vh}
.alts button{height:100%;margin:0;width:100%;font-size:56px;color:#fff}
</style>
</head>
<body>
<div id="tela"></div>
<script>
const DB = "https://teste-kahoot-538bf-default-rtdb.firebaseio.com/salas/";
const sala = new URLSearchParams(location.search).get("sala") || "";
const cores = ["#e21b3c", "#1368ce", "#d89e00", "#26890c"];
const letras = ["A", "B", "C", "D"];
const T = document.getElementById("tela");
let id = null, nome = "", respondida = 0, minhaAlt = 0, ultimo = "";

const url = c => DB + sala + "/" + c + ".json";

function msg(t) {
  T.innerHTML = "";
  const h = document.createElement("h2");
  h.textContent = t;
  T.appendChild(h);
}
  function entrada() {
  if (!sala) { msg("Escaneie o QR Code do jogo."); return; }
  T.innerHTML = '<h2>Sala ' + sala.replace(/[^A-Za-z0-9]/g, "") + '</h2>' +
    '<input id="nome" maxlength="15" placeholder="Seu nome">' +
    '<button onclick="entrar()">Entrar</button>';
}

function entrar() {
  nome = document.getElementById("nome").value.trim();
  if (!nome) return;
  id = "j" + Math.random().toString(36).slice(2, 8);
  fetch(url("jogadores/" + id), { method: "PUT", body: JSON.stringify({ nome: nome }) });
  msg("Pronto, " + nome + "! Aguarde o início.");
  setInterval(atualizar, 700);
}

async function atualizar() {
  let e;
  try { e = await (await fetch(url("estado"))).json(); } catch (x) { return; }
  if (!e) return;
  const chave = e.fase + e.n;
  if (chave === ultimo) return;
  ultimo = chave;
  if (e.fase === "pergunta") { if (respondida !== e.n) botoes(e.n); }
  else if (e.fase === "resultado") await resultado(e);
  else if (e.fase === "fim") await fim();
  else msg("Aguarde o início.");
}

function botoes(n) {
  T.innerHTML = "";
  const g = document.createElement("div");
  g.className = "alts";
  for (let i = 1; i <= 4; i++) {
    const b = document.createElement("button");
    b.textContent = letras[i - 1];
    b.style.background = cores[i - 1];
    b.onclick = () => responder(n, i);
    g.appendChild(b);
  }
  T.appendChild(g);
}

async function responder(n, alt) {
  respondida = n; minhaAlt = alt;
  msg("Resposta enviada! Aguarde.");
  await fetch(url("respostas/" + n + "/" + id), {
    method: "PUT",
    body: JSON.stringify({ alt: alt, t: { ".sv": "timestamp" } })
  });
}

async function resultado(e) {
  const p = await (await fetch(url("pontos/" + id))).json();
  const acertou = respondida === e.n && minhaAlt === e.correta;
  msg((acertou ? "Acertou!" : "Errou ou não respondeu.") + " Seus pontos: " + (p || 0));
}

async function fim() {
  const p = await (await fetch(url("pontos/" + id))).json();
  msg("Fim de jogo! Você fez " + (p || 0) + " pontos.");
}

entrada();
</script>
</body>
</html>
